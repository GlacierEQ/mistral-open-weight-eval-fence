[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mistral-open-weight-eval-fence"
version = "1.0.0"
description = "Budgeted failure-class eval portfolio planner and promotion fence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
open-weight-eval-fence = "open_weight_eval_cli:main"

[tool.setuptools]
py-modules = ["open_weight_eval_fence", "open_weight_eval_cli", "promotion_authority"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
